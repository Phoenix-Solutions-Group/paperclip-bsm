name: commitperclip PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# Always runs from base branch context — never executes PR code.
# pull_request_target gives access to secrets for untrusted fork PRs.

permissions:
  pull-requests: write
  checks: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout base branch (never PR code)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: master

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # commitperclip is the upstream review bot; its GitHub App private key is
      # held by the app owner, so forks of this repository cannot obtain it.
      # Without the key the token step exits 1 and reports this job as failed on
      # every single pull request, forever — a red check that no change to the
      # branch can ever clear, and that hides real failures behind noise.
      # Report the absent credential as an explicit skip instead. The steps that
      # protect the repository regardless of the bot — Dependency Review above —
      # stay unconditional and still fail the job.
      - name: Check for commitperclip credential
        id: credential
        env:
          COMMITPERCLIP_KEY: ${{ secrets.COMMITPERCLIP_KEY }}
        run: |
          if [ -n "$COMMITPERCLIP_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=commitperclip review skipped::COMMITPERCLIP_KEY is not configured for this repository, so the commitperclip bot review did not run. Dependency Review still ran and still gates this job."
            {
              echo "### commitperclip review skipped"
              echo
              echo "\`COMMITPERCLIP_KEY\` is not configured for this repository, so the bot review did not run."
              echo "Dependency Review still ran and still gates this job."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate commitperclip token
        id: token
        if: steps.credential.outputs.present == 'true'
        run: |
          TOKEN=$(node .github/scripts/get-bot-token.mjs)
          echo "::add-mask::$TOKEN"
          echo "value=$TOKEN" >> $GITHUB_OUTPUT
        env:
          COMMITPERCLIP_KEY: ${{ secrets.COMMITPERCLIP_KEY }}

      - name: Run quality gates
        id: quality
        if: >-
          steps.credential.outputs.present == 'true' &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        run: node .github/scripts/run-quality-gates.mjs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.token.outputs.value }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}

      - name: Fail if quality gates failed
        if: >-
          steps.credential.outputs.present == 'true' &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          steps.quality.outcome == 'failure'
        run: |
          echo "One or more quality gates failed. See commitperclip comment on the PR for details."
          exit 1
